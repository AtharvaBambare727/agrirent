<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Dashboard | AgriRent</title>
<style>
:root {
  --green: #1b5e20;
  --green2: #2e7d32;
  --green-light: #e8f5e9;
  --lime: #8bc34a;
  --ink: #183322;
  --muted: #5e7063;
  --cream: #f6f8f1;
  --line: #e2e8dc;
  --white: #ffffff;
  --shadow-sm: 0 4px 12px rgba(25, 70, 35, 0.06);
  --shadow: 0 16px 36px rgba(25, 70, 35, 0.10);
  --radius: 12px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  color: var(--ink);
  background: #f8faf6;
  line-height: 1.6;
}

a { text-decoration: none; color: inherit; }
button, input, select, textarea { font: inherit; }
button { cursor: pointer; }

.container {
  width: min(1180px, calc(100% - 36px));
  margin: 0 auto;
}

/* Header */
header {
  height: 74px;
  background: var(--white);
  border-bottom: 1px solid var(--line);
  position: sticky;
  top: 0;
  z-index: 40;
}

.nav {
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 22px;
  font-weight: 800;
  color: var(--green);
}

.brand-mark {
  width: 38px;
  height: 38px;
  border-radius: 10px;
  background: var(--green-light);
  display: grid;
  place-items: center;
  font-size: 20px;
}

.user-badge {
  display: flex;
  align-items: center;
  gap: 12px;
}

.btn {
  border: 0;
  border-radius: 9px;
  padding: 8px 16px;
  font-weight: 700;
  font-size: 13px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  transition: all 0.2s;
}

.btn-primary {
  background: var(--green2);
  color: var(--white);
}
.btn-primary:hover { background: var(--green); }

.btn-outline {
  border: 1px solid #c2d6c4;
  background: var(--white);
  color: var(--green);
}
.btn-outline:hover { background: var(--green-light); }

.btn-danger {
  background: #ffebee;
  color: #c62828;
  border: 1px solid #ffcdd2;
}
.btn-danger:hover { background: #ef9a9a; }

.btn-success {
  background: #e8f5e9;
  color: #2e7d32;
  border: 1px solid #c8e6c9;
}
.btn-success:hover { background: #a5d6a7; }

/* Dashboard Content */
main {
  padding: 36px 0 60px;
}

.dashboard-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 28px;
  flex-wrap: wrap;
  gap: 16px;
}

.dashboard-title h1 {
  font-size: 28px;
  color: #16381e;
  letter-spacing: -0.5px;
}
.dashboard-title p {
  font-size: 14px;
  color: var(--muted);
}

/* Stats Cards */
.stats-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 18px;
  margin-bottom: 34px;
}

.stat-card {
  background: var(--white);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 20px;
  box-shadow: var(--shadow-sm);
  display: flex;
  align-items: center;
  gap: 16px;
}

.stat-icon {
  width: 50px;
  height: 50px;
  border-radius: 12px;
  background: var(--green-light);
  display: grid;
  place-items: center;
  font-size: 24px;
}

.stat-info strong {
  display: block;
  font-size: 24px;
  color: var(--green);
  line-height: 1.2;
}
.stat-info span {
  font-size: 12px;
  font-weight: 600;
  color: var(--muted);
}

/* Section Card */
.dashboard-card {
  background: var(--white);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 26px;
  box-shadow: var(--shadow-sm);
  margin-bottom: 32px;
}

.card-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
  flex-wrap: wrap;
  gap: 12px;
}

.card-header h2 {
  font-size: 20px;
  color: #173b22;
}

/* Table Styles */
.table-responsive {
  overflow-x: auto;
}

table {
  width: 100%;
  border-collapse: collapse;
  font-size: 14px;
  text-align: left;
}

th {
  background: #f4f8f1;
  color: #3b5042;
  font-weight: 700;
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  padding: 12px 14px;
  border-bottom: 1px solid var(--line);
}

td {
  padding: 14px;
  border-bottom: 1px solid #f0f4ed;
  color: #29382e;
}

tr:hover td {
  background: #fbfdf9;
}

/* Status Badges */
.badge {
  padding: 4px 10px;
  border-radius: 20px;
  font-size: 11px;
  font-weight: 800;
  display: inline-block;
  text-transform: capitalize;
}
.badge-pending { background: #fff8e1; color: #f57f17; }
.badge-approved { background: #e8f5e9; color: #2e7d32; }
.badge-rejected { background: #ffebee; color: #c62828; }
.badge-cancelled { background: #eceff1; color: #546e7a; }

/* Action Buttons inside Table */
.action-group {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}

/* Empty State */
.empty-box {
  text-align: center;
  padding: 40px 20px;
  color: var(--muted);
}
.empty-box .icon { font-size: 40px; margin-bottom: 10px; }

/* Bulletproof Full-Screen Modals */
.modal-backdrop {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  width: 100vw;
  height: 100vh;
  background: rgba(16, 36, 22, 0.70);
  backdrop-filter: blur(5px);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 99999;
  padding: 20px;
}
.modal-backdrop.open {
  display: flex !important;
}

.modal {
  background: var(--white);
  border-radius: 18px;
  max-width: 520px;
  width: 100%;
  padding: 28px;
  box-shadow: var(--shadow);
  position: relative;
  max-height: 90vh;
  overflow-y: auto;
  animation: modalScale 0.2s ease-out;
}
@keyframes modalScale {
  from { transform: scale(0.95); opacity: 0; }
  to { transform: scale(1); opacity: 1; }
}

.modal-close {
  position: absolute;
  top: 16px;
  right: 18px;
  border: 0;
  background: #f1f5ee;
  width: 32px;
  height: 32px;
  border-radius: 50%;
  font-size: 18px;
  display: grid;
  place-items: center;
  color: #4c5d51;
}

.field {
  display: flex;
  flex-direction: column;
  margin-bottom: 14px;
}

.field label {
  font-size: 12px;
  font-weight: 700;
  color: #4b5d4f;
  margin-bottom: 6px;
  text-transform: uppercase;
}

.field input, .field select, .field textarea {
  width: 100%;
  padding: 10px 12px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: #fbfdf9;
  font-size: 14px;
}

.field input:focus, .field select:focus, .field textarea:focus {
  border-color: var(--green2);
  outline: none;
  background: var(--white);
}

/* Toast */
.toast {
  position: fixed;
  bottom: 24px;
  right: 24px;
  background: #173b22;
  color: var(--white);
  padding: 14px 22px;
  border-radius: 12px;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
  font-size: 14px;
  font-weight: 600;
  z-index: 100000;
  display: none;
}

@media (max-width: 900px) {
  .stats-grid { grid-template-columns: repeat(2, 1fr); }
}
@media (max-width: 600px) {
  .stats-grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<!-- Header -->
<header>
  <div class="container nav">
    <a class="brand" href="index.html">
      <span class="brand-mark">🌱</span>AgriRent
    </a>

    <div class="user-badge" id="userHeader">
      <a class="btn btn-outline" href="index.html">← Marketplace</a>
      <span id="userNameRole" style="font-size: 13px; font-weight: 700; color: var(--green);"></span>
      <button class="btn btn-outline" id="logoutBtn" type="button">Log Out</button>
    </div>
  </div>
</header>

<!-- Main Container -->
<main class="container">
  <!-- Dynamic Heading -->
  <div class="dashboard-head">
    <div class="dashboard-title">
      <h1 id="welcomeGreeting">Loading Dashboard...</h1>
      <p id="roleSubtext">Connected to SQLite Database</p>
    </div>
    <div id="headActionContainer"></div>
  </div>

  <!-- Role-based Dynamic Metrics -->
  <div class="stats-grid" id="statsGrid">
    <!-- Injected via JavaScript -->
  </div>

  <!-- Role-based Main Sections -->
  <div id="mainDashboardView">
    <div class="dashboard-card">
      <div class="empty-box">
        <div class="icon">🔄</div>
        <h3>Loading your account data...</h3>
      </div>
    </div>
  </div>
</main>

<!-- Add / Edit Equipment Modal (For Equipment Owner) -->
<div class="modal-backdrop" id="equipmentModal">
  <div class="modal">
    <button class="modal-close" id="closeEquipModal" type="button">×</button>
    <h2 id="equipModalTitle">Add Agricultural Equipment</h2>
    <p class="sub" id="equipModalSub">List your machinery so local farmers can rent it.</p>

    <form id="equipmentForm">
      <input type="hidden" id="editEquipId">

      <div class="field">
        <label for="eqName">Equipment Name *</label>
        <input id="eqName" type="text" placeholder="e.g. Mahindra 575 DI Tractor" required>
      </div>

      <div class="field">
        <label for="eqCategory">Category *</label>
        <select id="eqCategory" required>
          <option value="Tractors">Tractors</option>
          <option value="Harvesters">Harvesters</option>
          <option value="Tools">Tools & Tillers</option>
          <option value="Irrigation">Irrigation Pumps</option>
        </select>
      </div>

      <div class="field">
        <label for="eqPrice">Price Per Day (₹) *</label>
        <input id="eqPrice" type="number" min="50" max="100000" placeholder="e.g. 1200" required>
      </div>

      <div class="field">
        <label for="eqLocation">Village / District / Location *</label>
        <input id="eqLocation" type="text" placeholder="e.g. Nashik, Maharashtra" required>
      </div>

      <div class="field">
        <label for="eqIcon">Icon Emoji</label>
        <select id="eqIcon">
          <option value="🚜">🚜 Farm Tractor</option>
          <option value="🌾">🌾 Combine Harvester</option>
          <option value="⚙️">⚙️ Rotavator / Tiller</option>
          <option value="💧">💧 Water Pump</option>
          <option value="🌱">🌱 Seed Drill</option>
          <option value="🧑‍🌾">🧑‍🌾 Crop Sprayer</option>
        </select>
      </div>

      <div class="field">
        <label for="eqDesc">Description & Specifications</label>
        <textarea id="eqDesc" rows="3" placeholder="Horsepower, maintenance condition, implements included..."></textarea>
      </div>

      <div id="equipError" style="display:none; color:#c62828; font-size:13px; margin-bottom:12px;"></div>
      <button class="btn btn-primary" type="submit" id="saveEquipBtn" style="width: 100%;">Save Equipment</button>
    </form>
  </div>
</div>

<!-- Toast Alert -->
<div class="toast" id="toast"></div>

<!-- JavaScript Integration -->
<script>
let currentUser = null;
let myEquipmentList = [];
let myRentalsList = [];

// Helper API Caller
async function callApi(path, options = {}) {
  const opts = {
    method: options.method || 'GET',
    headers: options.body ? { 'Content-Type': 'application/json' } : {}
  };
  if (options.body) opts.body = JSON.stringify(options.body);

  const res = await fetch(path, opts);
  let data = {};
  try { data = await res.json(); } catch (_) {}
  if (!res.ok) {
    throw new Error(data.error || 'Request failed.');
  }
  return data;
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.display = 'block';
  setTimeout(() => { t.style.display = 'none'; }, 4000);
}

function esc(str) {
  return String(str || '').replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}

// Check Authentication on Page Load
async function initDashboard() {
  try {
    const authData = await callApi('/api/auth/me');
    if (!authData.user) {
      sessionStorage.setItem('openLogin', '1');
      window.location.href = 'index.html';
      return;
    }
    currentUser = authData.user;
    document.getElementById('userNameRole').textContent = `👋 ${currentUser.name} (${currentUser.role})`;
    document.getElementById('welcomeGreeting').textContent = `Welcome, ${currentUser.name}!`;

    await loadStats();
    if (currentUser.role === 'Equipment Owner') {
      renderOwnerDashboard();
    } else if (currentUser.role === 'Farmer') {
      renderFarmerDashboard();
    } else {
      renderAdminDashboard();
    }
  } catch (err) {
    showToast(err.message);
  }
}

// Load Dashboard Summary Statistics
async function loadStats() {
  const statsContainer = document.getElementById('statsGrid');
  try {
    const s = await callApi('/api/dashboard/stats');

    if (currentUser.role === 'Farmer') {
      statsContainer.innerHTML = `
        <div class="stat-card">
          <div class="stat-icon">📑</div>
          <div class="stat-info"><strong>${s.total_bookings}</strong><span>Total Requests</span></div>
        </div>
        <div class="stat-card">
          <div class="stat-icon">⏳</div>
          <div class="stat-info"><strong>${s.pending_requests}</strong><span>Pending Approval</span></div>
        </div>
        <div class="stat-card">
          <div class="stat-icon">✅</div>
          <div class="stat-info"><strong>${s.approved_rentals}</strong><span>Approved Bookings</span></div>
        </div>
        <div class="stat-card">
          <div class="stat-icon">💰</div>
          <div class="stat-info"><strong>₹${(s.total_spent || 0).toLocaleString('en-IN')}</strong><span>Total Investment</span></div>
        </div>
      `;
    } else if (currentUser.role === 'Equipment Owner') {
      statsContainer.innerHTML = `
        <div class="stat-card">
          <div class="stat-icon">🚜</div>
          <div class="stat-info"><strong>${s.total_equipment}</strong><span>Listed Machines</span></div>
        </div>
        <div class="stat-card">
          <div class="stat-icon">📩</div>
          <div class="stat-info"><strong>${s.total_requests}</strong><span>Total Requests</span></div>
        </div>
        <div class="stat-card">
          <div class="stat-icon">⏳</div>
          <div class="stat-info"><strong>${s.pending_requests}</strong><span>Pending Review</span></div>
        </div>
        <div class="stat-card">
          <div class="stat-icon">💵</div>
          <div class="stat-info"><strong>₹${(s.total_earnings || 0).toLocaleString('en-IN')}</strong><span>Approved Revenue</span></div>
        </div>
      `;
    } else {
      // Admin
      statsContainer.innerHTML = `
        <div class="stat-card">
          <div class="stat-icon">👥</div>
          <div class="stat-info"><strong>${s.total_users}</strong><span>Total Users</span></div>
        </div>
        <div class="stat-card">
          <div class="stat-icon">🚜</div>
          <div class="stat-info"><strong>${s.total_equipment}</strong><span>All Equipment</span></div>
        </div>
        <div class="stat-card">
          <div class="stat-icon">📑</div>
          <div class="stat-info"><strong>${s.total_rentals}</strong><span>Total Rentals</span></div>
        </div>
        <div class="stat-card">
          <div class="stat-icon">⏳</div>
          <div class="stat-info"><strong>${s.pending_rentals}</strong><span>Pending Approvals</span></div>
        </div>
      `;
    }
  } catch (_) {}
}

// -------------------------------------------------------------
// EQUIPMENT OWNER DASHBOARD
// -------------------------------------------------------------
async function renderOwnerDashboard() {
  document.getElementById('roleSubtext').textContent = 'Equipment Owner Hub · Manage Machinery & Farmer Requests';
  document.getElementById('headActionContainer').innerHTML = `
    <button class="btn btn-primary" type="button" data-action="add-equip" onclick="openAddEquipModal()">➕ Add New Equipment</button>
  `;

  const mainView = document.getElementById('mainDashboardView');

  try {
    const [rentalsData, equipData] = await Promise.all([
      callApi('/api/rentals'),
      callApi('/api/my/equipment')
    ]);
    myRentalsList = rentalsData.rentals || [];
    myEquipmentList = equipData.equipment || [];

    mainView.innerHTML = `
      <!-- Section 1: Incoming Rental Requests -->
      <div class="dashboard-card">
        <div class="card-header">
          <h2>📥 Rental Requests Received from Farmers</h2>
          <span style="font-size:13px; color:var(--muted);">${myRentalsList.length} total request(s)</span>
        </div>

        ${myRentalsList.length === 0 ? `
          <div class="empty-box">
            <div class="icon">📭</div>
            <h3>No rental requests received yet</h3>
            <p>When farmers request your machinery, their requests will appear here for your approval.</p>
          </div>
        ` : `
          <div class="table-responsive">
            <table>
              <thead>
                <tr>
                  <th>Equipment</th>
                  <th>Farmer Details</th>
                  <th>Rental Dates</th>
                  <th>Estimated Price</th>
                  <th>Note from Farmer</th>
                  <th>Status</th>
                  <th>Action</th>
                </tr>
              </thead>
              <tbody>
                ${myRentalsList.map(r => `
                  <tr>
                    <td><strong>${esc(r.equipment_icon || '🚜')} ${esc(r.equipment_name)}</strong></td>
                    <td>
                      <strong>${esc(r.renter_name)}</strong><br>
                      <small style="color:var(--muted)">📞 ${esc(r.renter_phone)}</small>
                    </td>
                    <td>${esc(r.start_date)} to ${esc(r.end_date)}</td>
                    <td><strong>₹${Number(r.total_price).toLocaleString('en-IN')}</strong></td>
                    <td style="max-width:200px; font-size:13px; color:var(--muted);">${esc(r.message || '—')}</td>
                    <td><span class="badge badge-${r.status}">${r.status}</span></td>
                    <td>
                      ${r.status === 'pending' ? `
                        <div class="action-group">
                          <button class="btn btn-success" style="padding:5px 10px; font-size:12px;" type="button" data-action="approve-rental" data-id="${r.id}" onclick="updateRentalStatus(${r.id}, 'approved')">✔ Approve</button>
                          <button class="btn btn-danger" style="padding:5px 10px; font-size:12px;" type="button" data-action="reject-rental" data-id="${r.id}" onclick="updateRentalStatus(${r.id}, 'rejected')">✖ Reject</button>
                        </div>
                      ` : `
                        <span style="color:var(--muted); font-size:12px;">Completed</span>
                      `}
                    </td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        `}
      </div>

      <!-- Section 2: Listed Machinery Inventory -->
      <div class="dashboard-card">
        <div class="card-header">
          <h2>🚜 My Machinery Inventory</h2>
          <span style="font-size:13px; color:var(--muted);">${myEquipmentList.length} machine(s) listed</span>
        </div>

        ${myEquipmentList.length === 0 ? `
          <div class="empty-box">
            <div class="icon">🌾</div>
            <h3>You haven't listed any equipment yet</h3>
            <p>Click "Add New Equipment" above to list your tractors, harvesters, or irrigation tools.</p>
          </div>
        ` : `
          <div class="table-responsive">
            <table>
              <thead>
                <tr>
                  <th>Machine</th>
                  <th>Category</th>
                  <th>Daily Rate</th>
                  <th>Location</th>
                  <th>Availability Status</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody>
                ${myEquipmentList.map(item => `
                  <tr>
                    <td>
                      <strong>${esc(item.icon)} ${esc(item.name)}</strong><br>
                      <small style="color:var(--muted)">${esc(item.description).slice(0, 50)}...</small>
                    </td>
                    <td>${esc(item.category)}</td>
                    <td><strong>₹${Number(item.price_per_day).toLocaleString('en-IN')}</strong> / day</td>
                    <td>📍 ${esc(item.location)}</td>
                    <td>
                      <span class="badge ${item.available ? 'badge-approved' : 'badge-cancelled'}">
                        ${item.available ? '🟢 Available' : '⚪ Unavailable'}
                      </span>
                    </td>
                    <td>
                      <div class="action-group">
                        <button class="btn btn-outline" style="padding:5px 10px; font-size:12px;" type="button" data-action="toggle-equip" data-id="${item.id}" onclick="toggleAvailability(${item.id})">
                          ${item.available ? 'Set Inactive' : 'Set Available'}
                        </button>
                        <button class="btn btn-outline" style="padding:5px 10px; font-size:12px;" type="button" data-action="edit-equip" data-id="${item.id}" onclick="openEditEquipModal(${item.id})">✏ Edit</button>
                        <button class="btn btn-danger" style="padding:5px 10px; font-size:12px;" type="button" data-action="delete-equip" data-id="${item.id}" onclick="deleteEquipmentItem(${item.id})">🗑 Delete</button>
                      </div>
                    </td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        `}
      </div>
    `;
  } catch (err) {
    mainView.innerHTML = `<div class="dashboard-card"><p style="color:red">${esc(err.message)}</p></div>`;
  }
}

// -------------------------------------------------------------
// FARMER DASHBOARD
// -------------------------------------------------------------
async function renderFarmerDashboard() {
  document.getElementById('roleSubtext').textContent = 'Farmer Portal · Track Your Equipment Bookings & Rental History';
  document.getElementById('headActionContainer').innerHTML = `
    <a class="btn btn-primary" href="index.html#equipment">🔍 Browse Equipment</a>
  `;

  const mainView = document.getElementById('mainDashboardView');

  try {
    const data = await callApi('/api/rentals');
    myRentalsList = data.rentals || [];

    mainView.innerHTML = `
      <div class="dashboard-card">
        <div class="card-header">
          <h2>📑 My Rental Requests & History</h2>
          <span style="font-size:13px; color:var(--muted);">${myRentalsList.length} booking request(s)</span>
        </div>

        ${myRentalsList.length === 0 ? `
          <div class="empty-box">
            <div class="icon">🚜</div>
            <h3>No rental bookings found</h3>
            <p>You haven't requested any farm machinery yet. Browse available equipment and rent what you need!</p>
            <a class="btn btn-primary" href="index.html#equipment" style="margin-top:14px;">Browse Equipment Marketplace →</a>
          </div>
        ` : `
          <div class="table-responsive">
            <table>
              <thead>
                <tr>
                  <th>Equipment</th>
                  <th>Owner Contact</th>
                  <th>Dates Requested</th>
                  <th>Total Price</th>
                  <th>Status</th>
                  <th>Action</th>
                </tr>
              </thead>
              <tbody>
                ${myRentalsList.map(r => `
                  <tr>
                    <td>
                      <strong>${esc(r.equipment_icon || '🚜')} ${esc(r.equipment_name)}</strong><br>
                      <small style="color:var(--muted)">📍 ${esc(r.equipment_location)}</small>
                    </td>
                    <td>
                      <strong>${esc(r.owner_name)}</strong><br>
                      <small style="color:var(--green2)">📞 ${esc(r.owner_phone)}</small>
                    </td>
                    <td>${esc(r.start_date)} to ${esc(r.end_date)}</td>
                    <td><strong>₹${Number(r.total_price).toLocaleString('en-IN')}</strong></td>
                    <td>
                      <span class="badge badge-${r.status}">
                        ${r.status === 'approved' ? '🟢 Approved' : r.status === 'pending' ? '🟡 Pending Review' : r.status === 'rejected' ? '🔴 Rejected' : '⚪ Cancelled'}
                      </span>
                    </td>
                    <td>
                      ${(r.status === 'pending' || r.status === 'approved') ? `
                        <button class="btn btn-danger" style="padding:5px 10px; font-size:12px;" type="button" data-action="cancel-rental" data-id="${r.id}" onclick="cancelMyRental(${r.id})">Cancel Request</button>
                      ` : `
                        <span style="color:var(--muted); font-size:12px;">Archived</span>
                      `}
                    </td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        `}
      </div>
    `;
  } catch (err) {
    mainView.innerHTML = `<div class="dashboard-card"><p style="color:red">${esc(err.message)}</p></div>`;
  }
}

      <div class="dashboard-card">

                <tr>

                  <td><span class="badge badge-approved">${esc(u.role)}</span></td>

      </div>

      <div class="dashboard-card">

          <h2>📑 Platform Rental Records</h2>
          <span style="font-size:13px; color:var(--muted);">${rentals.length} record(s)</span>
        </div>
        <div class="table-responsive">
          <table>
            <thead>
              <tr>
                <th>Machine</th>
                <th>Farmer</th>

                <th>Dates</th>
                <th>Total Price</th>
                <th>Status</th>
              </tr>
            </thead>

              ${rentals.map(r => `
                <tr>
                  <td>${esc(r.equipment_icon)} ${esc(r.equipment_name)}</td>

// -------------------------------------------------------------
// Equipment Owner Actions
// -------------------------------------------------------------

function openAddEquipModal() {
  document.getElementById('equipModalTitle').textContent = 'Add Agricultural Equipment';
  document.getElementById('equipModalSub').textContent = 'List new machinery in the SQLite database.';
  document.getElementById('editEquipId').value = '';
  document.getElementById('equipmentForm').reset();
  document.getElementById('equipError').style.display = 'none';
  document.getElementById('equipmentModal').classList.add('open');
}

function openEditEquipModal(id) {
  const numId = Number(id);
  const item = myEquipmentList.find(e => e.id == numId);
  if (!item) return;

  document.getElementById('equipModalTitle').textContent = 'Edit Equipment Details';
  document.getElementById('equipModalSub').textContent = `Editing #${item.id}: ${item.name}`;
  document.getElementById('editEquipId').value = item.id;
  document.getElementById('eqName').value = item.name;
  document.getElementById('eqCategory').value = item.category;
  document.getElementById('eqPrice').value = item.price_per_day;
  document.getElementById('eqLocation').value = item.location;
  document.getElementById('eqIcon').value = item.icon || '🚜';
  document.getElementById('eqDesc').value = item.description;

  document.getElementById('equipError').style.display = 'none';
  document.getElementById('equipmentModal').classList.add('open');
}

document.getElementById('closeEquipModal').addEventListener('click', () => {
  document.getElementById('equipmentModal').classList.remove('open');
});

// Submit Add or Edit Equipment Form
document.getElementById('equipmentForm').addEventListener('submit', async e => {
  e.preventDefault();
  const errBox = document.getElementById('equipError');
  errBox.style.display = 'none';

  const editId = document.getElementById('editEquipId').value;
  const payload = {
    name: document.getElementById('eqName').value,
    category: document.getElementById('eqCategory').value,
    price_per_day: Number(document.getElementById('eqPrice').value),
    location: document.getElementById('eqLocation').value,
    icon: document.getElementById('eqIcon').value,
    description: document.getElementById('eqDesc').value
  };

  try {
    if (editId) {
      await callApi(`/api/equipment/${editId}`, { method: 'PUT', body: payload });
      showToast('Equipment updated successfully!');
    } else {
      await callApi('/api/equipment', { method: 'POST', body: payload });
      showToast('New equipment added successfully to database!');
    }

    document.getElementById('equipmentModal').classList.remove('open');
    await loadStats();
    renderOwnerDashboard();
  } catch (err) {
    errBox.textContent = err.message;
    errBox.style.display = 'block';
  }
});

// Toggle Equipment Availability
async function toggleAvailability(id) {
  try {
    const res = await callApi(`/api/equipment/${id}/toggle-availability`, { method: 'PATCH' });
    showToast(res.message || 'Availability updated.');
    renderOwnerDashboard();
  } catch (err) {
    showToast(err.message);
  }
}

// Delete Equipment
async function deleteEquipmentItem(id) {
  if (!confirm('Are you sure you want to delete this equipment from your listings?')) return;
  try {
    await callApi(`/api/equipment/${id}`, { method: 'DELETE' });
    showToast('Equipment removed successfully.');
    await loadStats();
    renderOwnerDashboard();
  } catch (err) {
    showToast(err.message);
  }
}

// Approve / Reject Rental Request
async function updateRentalStatus(id, newStatus) {
  try {
    await callApi(`/api/rentals/${id}`, {
      method: 'PATCH',
      body: { status: newStatus }
    });
    showToast(`Rental request has been ${newStatus}!`);
    await loadStats();
    renderOwnerDashboard();
  } catch (err) {
    showToast(err.message);
  }
}

// Farmer Cancel Rental Request
async function cancelMyRental(id) {
  if (!confirm('Are you sure you want to cancel this rental request?')) return;
  try {
    await callApi(`/api/rentals/${id}`, {
      method: 'PATCH',
      body: { status: 'cancelled' }
    });
    showToast('Rental request cancelled.');
    await loadStats();
    renderFarmerDashboard();
  } catch (err) {
    showToast(err.message);
  }
}

// Global Event Delegation for Dashboard
document.addEventListener('click', e => {
  // Add equip button
  const addBtn = e.target.closest('[data-action="add-equip"]');
  if (addBtn) {
    e.preventDefault();
    openAddEquipModal();
    return;
  }

  // Edit equip button
  const editBtn = e.target.closest('[data-action="edit-equip"]');
  if (editBtn) {
    e.preventDefault();
    openEditEquipModal(editBtn.dataset.id);
    return;
  }

  // Delete equip button
  const delBtn = e.target.closest('[data-action="delete-equip"]');
  if (delBtn) {
    e.preventDefault();
    deleteEquipmentItem(delBtn.dataset.id);
    return;
  }

  // Toggle equip button
  const togBtn = e.target.closest('[data-action="toggle-equip"]');
  if (togBtn) {
    e.preventDefault();
    toggleAvailability(togBtn.dataset.id);
    return;
  }

  // Approve rental
  const appBtn = e.target.closest('[data-action="approve-rental"]');
  if (appBtn) {
    e.preventDefault();
    updateRentalStatus(appBtn.dataset.id, 'approved');
    return;
  }

  // Reject rental
  const rejBtn = e.target.closest('[data-action="reject-rental"]');
  if (rejBtn) {
    e.preventDefault();
    updateRentalStatus(rejBtn.dataset.id, 'rejected');
    return;
  }

  // Cancel rental
  const canBtn = e.target.closest('[data-action="cancel-rental"]');
  if (canBtn) {
    e.preventDefault();
    cancelMyRental(canBtn.dataset.id);
    return;
  }

  // Click outside backdrop
  if (e.target.classList.contains('modal-backdrop')) {
    e.target.classList.remove('open');
  }
});

// Expose functions globally for direct onclick
window.openAddEquipModal = openAddEquipModal;
window.openEditEquipModal = openEditEquipModal;
window.toggleAvailability = toggleAvailability;
window.deleteEquipmentItem = deleteEquipmentItem;
window.updateRentalStatus = updateRentalStatus;
window.cancelMyRental = cancelMyRental;

// Logout Button Handler
document.getElementById('logoutBtn').addEventListener('click', async () => {
  await callApi('/api/auth/logout', { method: 'POST' });
  showToast('Logged out.');
  setTimeout(() => { window.location.href = 'index.html'; }, 600);
});

// Run Init
initDashboard();
</script>
